server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Cache-Control no-cache always;

    error_page 404 = @missing_resource;
    location @missing_resource {
        add_header Cache-Control no-store always;
        return 404;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript image/svg+xml;

    location = /AItool {
        return 301 /AItool/$is_args$args;
    }
    location = /AItool/ {
        try_files /AItool/index.html =404;
    }
    location = /AItool/index.html {
        try_files $uri =404;
    }
    location ~ ^/AItool/(?:assets/(?:favicon\.svg|forest\.svg|demo\.mp4)|core/(?:index\.js|dist/selector\.(?:js|css)))$ {
        try_files $uri =404;
    }
    location / {
        return 404;
    }
}
