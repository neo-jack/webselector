name: 101my-aitool CI/CD

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - '.github/workflows/aitool-cicd.yml'
      - '.github/deploy/**'
      - '.gitattributes'
  pull_request:
    paths:
      - 'src/**'
      - '.github/workflows/aitool-cicd.yml'
      - '.github/deploy/**'
      - '.gitattributes'

permissions:
  contents: read

concurrency:
  group: 101my-aitool-server-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and check AItool
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Check deployment rollback
        run: |
          bash -n .github/deploy/deploy.sh
          node --test .github/deploy/deploy.test.mjs
      - name: Build bookmarklet
        run: node src/core/build.js
      - name: Check production Nginx image
        run: node --test .github/deploy/nginx.integration.test.mjs
      - name: Package install page
        run: |
          mkdir -p .github/deploy/site/assets .github/deploy/site/core/dist
          cp src/index.html .github/deploy/site/index.html
          cp src/assets/favicon.svg .github/deploy/site/assets/favicon.svg
          cp src/assets/forest.svg src/assets/demo.mp4 .github/deploy/site/assets/
          cp src/core/index.js .github/deploy/site/core/index.js
          cp src/core/dist/selector.js src/core/dist/selector.css .github/deploy/site/core/dist/
      - uses: actions/upload-artifact@v6
        with:
          name: aitool-site
          path: .github/deploy/site
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Publish image and deploy to server
    needs: build
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - name: Check server configuration
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
        run: |
          for name in SERVER_HOST SERVER_USER SERVER_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret: $name"
              exit 1
            fi
          done
      - uses: actions/download-artifact@v7
        with:
          name: aitool-site
          path: .github/deploy/site
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push server image
        id: image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/my-aitool"
          echo "ref=$image:$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          docker build --tag "$image:$GITHUB_SHA" --tag "$image:latest" .github/deploy
          docker push "$image:$GITHUB_SHA"
          docker push "$image:latest"
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_IMAGE: ${{ steps.image.outputs.ref }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: '22'
          timeout: 30s
          command_timeout: 30m
          envs: GHCR_USER,GHCR_TOKEN,DEPLOY_IMAGE
          script_path: .github/deploy/deploy.sh
