<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#17211b"><meta name="description" content="界面元素选择器：选择网页元素，提取截图、样式与组件上下文，复制提示词与源码位置。">
<title>界面元素选择器 · AItool</title><link rel="icon" href="assets/favicon.svg?v=cursor-spark-2" type="image/svg+xml" sizes="any">
<style>
*{box-sizing:border-box}body{margin:0;background:#101b16;color:#f1eee2;font-family:Arial,'Microsoft YaHei',sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased}a{color:inherit}button{font:inherit;cursor:pointer}.landscape{position:fixed;inset:0;z-index:-2;background:linear-gradient(90deg,#08130ddb,#12211950 65%,#07100cab),url('assets/forest.svg') center/cover}.landscape:after{content:'';position:absolute;inset:0;background:linear-gradient(0deg,#08110ff2,transparent 70%)}.glow{position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(ellipse at 62% 20%,#d9db9b19,transparent 48%)}header{max-width:1120px;margin:auto;padding:36px 40px;display:flex;align-items:center;flex-wrap:wrap;gap:10px 18px}.brand-tagline{font-size:13px;line-height:1.6;color:#b7c1b4}.brand{font-size:19px;font-weight:600;letter-spacing:-.6px;text-decoration:none;color:#e4c685}main{max-width:1120px;min-height:calc(100svh - 100px);margin:auto;padding:40px 40px 110px;display:grid;grid-template-columns:.8fr 1.2fr;gap:72px;align-items:center}h1{font-size:clamp(30px,3.2vw,44px);line-height:1.4;letter-spacing:-1.6px;font-weight:500;margin:0 0 30px}.install-note{font-size:13px;color:#b7c1b4;line-height:1.8;margin:0 0 12px}.bm{display:inline-flex;align-items:center;gap:40px;padding:14px 22px;background:#e5ce98;color:#233023;border-radius:8px;text-decoration:none;font-size:14px;font-weight:600;cursor:grab}.bm:hover{background:#f2ddb0}.bm.loading{opacity:.4;pointer-events:none}.connection{margin-top:32px;font-size:12px;line-height:1.9;color:#9ca993;max-width:300px}.connection code{font-size:11px;color:#ded2b1}.err{display:none;color:#f4b89c;font-size:12px}figure{margin:0}video{display:block;width:100%;aspect-ratio:16/10;background:#000;border:1px solid #c8d1b23d;border-radius:12px;object-fit:contain;box-shadow:0 20px 65px #0007}a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid #e3c68b;outline-offset:5px}@media(max-width:760px){header{padding:28px 24px}main{min-height:auto;padding:44px 24px 56px;grid-template-columns:1fr;gap:48px;max-width:560px}h1{font-size:34px}.connection{max-width:none}}
.connection code{overflow-wrap:anywhere}.connection pre{white-space:pre-wrap;overflow-wrap:anywhere;margin:12px 0;padding:12px;background:#ffffff08;border-radius:6px}
video:fullscreen{width:100%;height:100%;aspect-ratio:auto;border:0;border-radius:0;object-fit:contain;background:#000}
</style><script src="core/index.js"></script></head>
<body><div class="landscape" aria-hidden="true"></div><div class="glow" aria-hidden="true"></div><header><a class="brand" href="./">AItool</a><span class="brand-tagline">界面元素选择器</span></header><main>
<section aria-labelledby="title"><h1 id="title">选中元素，交给 AI。</h1>
<p class="install-note">拖到书签栏，在需要时点击。</p>
<a id="bm-link" class="bm loading" href="#" draggable="true">AItool</a>
<p id="bm-err" class="err" role="alert">加载失败，请刷新重试。</p>
<div class="connection">
<p>在目标网页点击书签，选择元素并填写修改要求，然后点击“复制提示词”，粘贴到你使用的 AI 工具。</p>
<p>无需安装本机服务或连接编辑器。附带截图时按浏览器提示授权；设置仅保存在当前网站。</p>
</div></section>
<figure><video controls muted loop playsinline preload="metadata" aria-label="界面元素选择器操作演示"><source src="assets/demo.mp4?v=web-20260924" type="video/mp4">你的浏览器不支持此视频。</video><figcaption>历史操作演示；当前版本使用复制后手动粘贴。</figcaption></figure>
</main>
<script>document.getElementById('bm-link').addEventListener('click',function(e){if(this.classList.contains('loading'))e.preventDefault();});</script></body></html>
